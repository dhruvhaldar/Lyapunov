<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌀</text></svg>">
    <title>Lyapunov Control Dashboard</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/glass.css">
    <!-- Load Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" integrity="sha384-dug+JxfBvklEQdJ4AYuBBAIScUz0bVN73xpy273gcAwHjb3qI0fXmuYNaNfdyYJG" crossorigin="anonymous"></script>
    <!-- Load D3.js -->
    <script src="https://d3js.org/d3.v7.9.0.min.js" integrity="sha384-4ru0IxoQKiGKAKBqSSeV+lwqCgO0nPptX7US9nqANfzW9M8StIQ8dZKbGi5h6t0q" crossorigin="anonymous"></script>
    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
</head>
<body>
    <div id="a11y-announcer" aria-live="polite" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;"></div>
    <noscript>
        <div style="background: #ef4444; color: white; padding: 16px; text-align: center; font-weight: bold; border-radius: 8px; margin: 16px;">
            ⚠️ JavaScript is required. This application relies on client-side rendering (D3.js, Chart.js, Three.js) for interactive visualizations. Please enable JavaScript to continue.
        </div>
    </noscript>
    <a href="#main-content" class="skip-to-content">Skip to main content</a>
    <div class="container">
        <header class="glass-panel" style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h1>Lyapunov Control Workbench</h1>
                <p>Nonlinear Control Playground & Simulator</p>
            </div>
            <div class="controls" style="margin-top: 0; padding-top: 0; border-top: none;">
                <label for="system-select" style="margin-right: 8px; display: inline-flex; align-items: center; gap: 8px;">
                    System Model:
                    <kbd id="kbd-s" class="kbd-shortcut" aria-hidden="true">S</kbd>
                </label>
                <select id="system-select" aria-keyshortcuts="s">
                    <option value="VanDerPol">Van der Pol</option>
                    <option value="Pendulum">Pendulum</option>
                    <option value="Lorenz">Lorenz</option>
                </select>
                <button id="refresh-btn" aria-keyshortcuts="r" aria-label="Restart simulation" title="Restart simulation (R)" style="margin-left: 8px; margin-right: 0; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; position: relative;">
                    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.21l5.67-1.36"/>
                    </svg>
                    <kbd id="kbd-r" class="kbd-shortcut" aria-hidden="true">R</kbd>
                </button>
            </div>
        </header>

        <main id="main-content" tabindex="-1" style="position: relative; transition: opacity 0.3s ease; outline: none;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 2rem; margin-bottom: 2rem;">
            <div class="glass-panel" role="region" aria-labelledby="heading-phase">
                <h2 id="heading-phase">Phase Portrait</h2>
                <div id="phase-portrait" role="img" tabindex="0" aria-label="Interactive phase portrait showing system trajectories and vector fields" style="width: 100%; height: 400px; background: rgba(0,0,0,0.2); border-radius: 8px;"></div>
            </div>

            <div class="glass-panel" role="region" aria-labelledby="heading-time">
                <h2 id="heading-time">Time Response</h2>
                <div style="width: 100%; height: 400px; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 16px; box-sizing: border-box;">
                    <canvas id="time-response-chart" role="img" tabindex="0" aria-label="Interactive time response chart showing system states over time">
                        Your browser does not support the canvas element. This visualization shows the time response of the selected system.
                    </canvas>
                </div>
            </div>
        </div>

        <div class="glass-panel" role="region" aria-labelledby="heading-3d">
             <h2 id="heading-3d">3D Visualization</h2>
             <div id="3d-view" role="img" tabindex="0" aria-label="Interactive 3D visualization of the dynamical system. Focus to pause animation." style="width: 100%; height: 400px; background: rgba(0,0,0,0.2); border-radius: 8px;">
                <div class="paused-badge" aria-hidden="true">⏸ Paused</div>
             </div>
        </div>
        </main>
    </div>

    <!-- Application Scripts -->
    <script src="js/phase_portrait.js"></script>
    <script src="js/time_response.js"></script>
    <script src="js/systems_gl.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
