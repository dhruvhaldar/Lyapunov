<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌀</text></svg>">
    <title>Lyapunov Control Dashboard</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/glass.css">
    <!-- Load Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" integrity="sha384-dug+JxfBvklEQdJ4AYuBBAIScUz0bVN73xpy273gcAwHjb3qI0fXmuYNaNfdyYJG" crossorigin="anonymous"></script>
    <!-- Load D3.js -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
    <!-- Load Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
</head>
<body>
    <div id="a11y-announcer" aria-live="polite" class="sr-only"></div>
    <noscript>
        <div class="noscript-warning">
            ⚠️ JavaScript is required. This application relies on client-side rendering (D3.js, Chart.js, Three.js) for interactive visualizations. Please enable JavaScript to continue.
        </div>
    </noscript>
    <a href="#main-content" class="skip-to-content">Skip to main content</a>
    <div class="container">
        <header class="glass-panel header-panel">
            <div>
                <h1>Lyapunov Control Workbench</h1>
                <p>Nonlinear Control Playground & Simulator</p>
            </div>
            <div class="controls header-controls">
                <label for="system-select" class="system-select-label">
                    System Model:
                    <kbd id="kbd-s" class="kbd-shortcut" aria-hidden="true">S</kbd>
                </label>
                <select id="system-select" aria-keyshortcuts="s" aria-controls="main-content">
                    <option value="VanDerPol">Van der Pol</option>
                    <option value="Pendulum">Pendulum</option>
                    <option value="Lorenz">Lorenz</option>
                </select>
                <button type="button" id="refresh-btn" aria-keyshortcuts="r" aria-label="Restart simulation" title="Restart simulation (R)" class="icon-btn icon-btn-refresh">
                    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.21l5.67-1.36"/>
                    </svg>
                    <kbd id="kbd-r" class="kbd-shortcut" aria-hidden="true">R</kbd>
                </button>
                <button type="button" id="copy-link-btn" aria-keyshortcuts="c" aria-label="Copy link to current state" title="Copy link to current state (C)" class="icon-btn icon-btn-copy">
                    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    <kbd id="kbd-c" class="kbd-shortcut" aria-hidden="true">C</kbd>
                </button>
            </div>
        </header>

        <main id="main-content" tabindex="-1" class="main-content">
        <div class="grid-container">
            <div class="glass-panel" role="region" aria-labelledby="heading-phase">
                <h2 id="heading-phase">Phase Portrait</h2>
                <div id="phase-portrait" role="img" tabindex="0" aria-label="Interactive phase portrait showing system trajectories and vector fields" class="viz-container"></div>
            </div>

            <div class="glass-panel" role="region" aria-labelledby="heading-time">
                <h2 id="heading-time">Time Response</h2>
                <div class="viz-container viz-container-padded">
                    <canvas id="time-response-chart" role="img" tabindex="0" aria-label="Interactive time response chart showing system states over time">
                        Your browser does not support the canvas element. This visualization shows the time response of the selected system.
                    </canvas>
                </div>
            </div>
        </div>

        <div class="glass-panel" role="region" aria-labelledby="heading-3d">
             <h2 id="heading-3d">3D Visualization</h2>
             <div id="3d-view" role="img" tabindex="0" aria-label="Interactive 3D visualization of the dynamical system. Focus to pause animation." class="viz-container">
                <div class="paused-badge" aria-hidden="true">⏸ Paused</div>
             </div>
        </div>
        </main>
    </div>

    <!-- Application Scripts -->
    <script src="js/phase_portrait.js"></script>
    <script src="js/time_response.js"></script>
    <script src="js/systems_gl.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
